<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/index.css' | relative_url }}">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand profile-brand" href="{{ '/' | relative_url }}" aria-label="Itoのプロフィール写真・トップへ"><img src="{{ '/face.png' | relative_url }}" alt="Itoのプロフィールアイコン" width="70" height="70"></a>
      <nav aria-label="メインナビゲーション">
        <a href="{{ '/' | relative_url }}#about">ABOUT</a><a href="{{ '/' | relative_url }}#works">WORKS</a><a href="{{ '/blog/' | relative_url }}">日記</a><a href="{{ '/' | relative_url }}#contact">CONTACT</a>
      </nav>
      <a class="top-link" href="https://github.com/Ito-hub0701" target="_blank" rel="noreferrer">GITHUB <span>↗</span></a>
    </header>
    <main class="site-main">{{ content }}</main>
    <footer><a class="brand footer-brand" href="{{ '/' | relative_url }}">I<span>.</span></a><span>© 2026 ITO. MADE WITH CURIOSITY.</span><a href="#top">ページ上部へ ↑</a></footer>
  </div>
</body>
</html>
